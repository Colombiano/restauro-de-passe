name: Compilar PDFs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-pictures texlive-fonts-recommended \
            texlive-lang-portuguese

      - name: Compilar cartas e regras
        run: ./ferramentas/compilar.sh

      - name: Guardar PDFs como artifact (90 dias)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: restauro-de-passe-pdfs
          path: |
            cartas/cartas.pdf
            regras/regras.pdf
          retention-days: 90

      - name: Publicar Release (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cartas/cartas.pdf
            regras/regras.pdf
          generate_release_notes: true
